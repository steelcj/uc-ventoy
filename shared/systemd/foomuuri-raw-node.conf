# Used on cloud-init based targets only (Ubuntu).
# Lets Foomuuri start before the network without an ordering cycle.
#
# foomuuri.service is ordered before network-pre.target, and its default
# dependencies also order it after sysinit.target. On Ubuntu, cloud-init is
# ordered before sysinit.target and, on 24.04, after the network is online.
# Together these form a cycle, which systemd breaks by not starting one of
# the units. Without the default dependencies Foomuuri starts as early as
# ufw.service and nftables.service do, and the cycle is gone.
[Unit]
DefaultDependencies=no
After=systemd-tmpfiles-setup.service
Conflicts=shutdown.target
Before=shutdown.target
